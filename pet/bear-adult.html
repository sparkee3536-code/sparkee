<style>
body.embed{margin:0;background:transparent;overflow:hidden}

</style>
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed-doc'),addEventListener('DOMContentLoaded',()=>document.body.classList.add('embed'));</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --fg:#1B2A22; --muted:#55645B; --line:#DCE3DA;

  --sky-top:#DCEAF7; --sky-bot:#EEF5E6;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --grass:#8FB4F0; --grass-ink:#0F1A13; --spark:#F5B94A; --spark-soft:#3A3018;
  --sky-top:#1D2C27; --sky-bot:#18221C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121915; --surface:#1B241F; --fg:#E6EEE8; --muted:#9EB0A4; --line:#2E3A32;
  --grass:#8FB4F0; --grass-ink:#0F1A13; --spark:#F5B94A; --spark-soft:#3A3018;
  --sky-top:#1D2C27; --sky-bot:#18221C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted)}
.stage{position:relative;width:100%;aspect-ratio:4/3.9;border-radius:24px;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot));border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}

.moves{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}

.moves button.sig{border-color:var(--spark)}
.moves button:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.toggle{display:flex;gap:10px;align-items:center;font-size:17px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--grass)}

<div class="wrap">
  <header>
    <h1>黑熊月牙成年</h1>
    <p class="sub">三個才藝試作：採蜂蜜、登山小隊（乳牛少年來互動）、肚肚彈跳床（兔寶寶、牛寶寶來互動）。拖曳可以轉視角。</p>
  </header>
  <div class="stage" id="stage">
    <div class="loading" id="loading">黑熊月牙成年載入中（約 12 MB）…</div>
    <span class="status" id="status" hidden>待機</span>
  </div>
  <div class="moves" role="group" aria-label="動作">
    <button data-move="idle" aria-pressed="true">待機</button>
    <button data-move="honey" class="sig" aria-pressed="false">採蜂蜜<small>13 秒</small></button>
    <button data-move="hike" class="sig" aria-pressed="false">登山小隊<small>13 秒</small></button>
    <button data-move="bounce" class="sig" aria-pressed="false">肚肚彈跳床<small>13 秒</small></button>
    <button data-move="sleep" aria-pressed="false">睡覺</button>
    <button data-move="eat" class="feed" aria-pressed="false">開心吃<small>6 秒</small></button>
    <button data-move="snack" class="feed" aria-pressed="false">最愛點心<small>7 秒</small></button>
    <button data-move="refuse" class="feed" aria-pressed="false">搖頭不吃<small>5 秒</small></button>
  </div>
  <label class="toggle"><input type="checkbox" id="loopT"> 才藝播完自動重播</label>
</div>
