<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121915; --surface:#1B241F; --fg:#E6EEE8; --muted:#9EB0A4; --line:#2E3A32;
  --grass:#8FB4F0; --grass-ink:#0F1A13; --spark:#F5B94A; --spark-soft:#3A3018;
  --sky-top:#1D2C27; --sky-bot:#18221C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121915; --surface:#1B241F; --fg:#E6EEE8; --muted:#9EB0A4; --line:#2E3A32;
  --grass:#8FB4F0; --grass-ink:#0F1A13; --spark:#F5B94A; --spark-soft:#3A3018;
  --sky-top:#1D2C27; --sky-bot:#18221C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}

.sub{margin:4px 0 0;color:var(--muted)}

<div class="wrap">

    <p class="sub">四個才藝試作：點亮公園、天空巡航（兔寶、牛寶一起搭乘，夜晚升空看台灣光點）、孵蛋時光、全員大合照（夥伴們來互動）。拖曳可以轉視角。</p>

  </div>
