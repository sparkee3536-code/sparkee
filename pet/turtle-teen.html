<style>

</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#121915; --surface:#1B241F; --fg:#E6EEE8; --muted:#9EB0A4; --line:#2E3A32;
  --grass:#7FD1BC; --grass-ink:#0F1A13; --spark:#F5B94A; --spark-soft:#3A3018;
  --sky-top:#1D2C27; --sky-bot:#18221C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}

.sub{margin:4px 0 0;color:var(--muted)}
.stage{position:relative;width:100%;aspect-ratio:4/3.9;border-radius:24px;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot));border:1px solid var(--line)}

.toggle{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}

const D_STAND = V3(0.15, 0, 0.45);
function poseDig(p, t, T){

  const go = ease(span(T, 0.0, 0.9)); p.x = lerp(-0.9, D_STAND.x, go); p.z = lerp(0.0, D_STAND.z, go); p.ry = lerp(1.2, 0.1, ease(span(T, 0.5, 1.1)));

const F_YAW = 1.15;

function poseFlip(p, t, T){

  place(p);
}
