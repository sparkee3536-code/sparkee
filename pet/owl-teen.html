:root{

:root[data-theme="dark"]{
  --bg:#121915; --surface:#1B241F; --fg:#E6EEE8; --muted:#9EB0A4; --line:#2E3A32;

  --sky-top:#1D2C27; --sky-bot:#18221C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}

function headTurn(yaw, pitch = 0){ rot('neck', 'y', yaw * 0.4); rot('Head', 'y', yaw * 0.6); rot('neck', 'x', pitch * 0.4); rot('Head', 'x', pitch * 0.6); }

function life(p, t, k = 1){

  rot('Head', 'y', 0.1 * Math.sin(t * 0.55) * k); rot('Head', 'x', 0.03 * Math.sin(t * 0.9) * k);

/* local direction (cat's yaw only) from the head to a world target, as yaw/pitch for headTurn */
const _hp = V3();
function lookAt(p, target, k = 1, lim = 0.85){
  _hp.set(p.x, 1.28 + gY + p.hop, p.z);
  const dx = target.x - _hp.x, dy = target.y - _hp.y, dz = target.z - _hp.z, c = Math.cos(p.ry), s = Math.sin(p.ry);
  const lx = dx * c - dz * s, lz = dx * s + dz * c;
  let yaw = Math.atan2(lx, lz), pit = -Math.atan2(dy, Math.hypot(lx, lz));
  yaw = Math.max(-lim, Math.min(lim, yaw)); pit = Math.max(-0.5, Math.min(0.5, pit));
  headTurn(yaw * k, pit * k);
}


/* owl-style big head turn: share the yaw over head, neck and upper spine (each joint stays <= 0.5 rad) */
function owlTurn(yaw, pitch = 0, roll = 0){
  const k = [['Head', 0.37], ['neck', 0.33], ['Spine', 0.18], ['Spine01', 0.12]];
  for (const [n, w] of k) rot(n, 'y', yaw * w);

function wings(a, flap = 0){ armsUp(a + flap); }   /* a: 0 = rest (about 37 deg below horizontal), 0.65 = horizontal */

function poseIdle(p, t, T){

// ---------- 轉頭偵查 ----------
const SQ_PEEK_L = V3(BUSH_L.x + 0.15, 0, BUSH_L.z + 0.25), SQ_PEEK_R = V3(BUSH_R.x - 0.15, 0, BUSH_R.z + 0.25), SQ_FRONT = V3(-0.8, 0, 0.55);
const sqPos = V3(); let sqState = {y: 0, yaw: 0, vis: false, wave: 0, run: 0};
function squirrelAt(T){
  const s = {vis: false, y: -0.5, yaw: 0, wave: 0, run: 0, p: V3()};
  const peek = (P, a, b) => { const u = span(T, a, b), up = ease(span(u, 0, 0.25)) * (1 - ease(span(u, 0.75, 1))); s.vis = up > 0.01; s.p.copy(P); s.y = lerp(-0.45, 0.2, up); s.yaw = Math.atan2(-P.x, 1.0 - P.z); };
  if (T >= 0.9 && T < 2.0) peek(SQ_PEEK_L, 0.9, 2.0);
  else if (T >= 2.7 && T < 3.7) peek(SQ_PEEK_R, 2.7, 3.7);
  else if (T >= 3.9 && T < 5.4){ /* runs from the right bush round behind the owl, out to the front */
    const u = span(T, 3.9, 5.4), a = lerp(-0.25, Math.PI + 1.2, u), r = 0.95;
    s.vis = true; s.y = 0.02 * Math.abs(Math.sin(T * 22)); s.p.set(Math.sin(a) * -r, 0, Math.cos(a) * -r + 0.05); if (u < 0.08) s.p.lerpVectors(SQ_PEEK_R, s.p, u / 0.08);
    const da = 0.02, nx = Math.sin(a + da) * -r, nz = Math.cos(a + da) * -r; s.yaw = Math.atan2(nx - s.p.x, nz - s.p.z + 0.05); s.run = 1;
    if (u > 0.85) s.p.lerpVectors(s.p, SQ_FRONT, ease(span(u, 0.85, 1)));
  }
  else if (T >= 5.4 && T < 9.0){ s.vis = true; s.p.copy(SQ_FRONT); s.y = 0.12 * bell(span(T, 6.3, 6.6)) + 0.12 * bell(span(T, 6.7, 7.0)); s.yaw = 0.55; s.wave = bell(span(T, 7.2, 8.6)); }
  else if (T >= 9.0 && T < 9.9){ const u = span(T, 9.0, 9.9); s.vis = u < 0.97; s.p.lerpVectors(SQ_FRONT, V3(BUSH_L.x + 0.2, 0, BUSH_L.z + 0.1), ease(u)); s.y = 0.03 * Math.abs(Math.sin(T * 22)); s.yaw = Math.atan2(BUSH_L.x - SQ_FRONT.x, BUSH_L.z - SQ_FRONT.z); s.run = 1; }
  return s;
}
function yawTo(p, P){ const dx = P.x - p.x, dz = P.z - p.z; let a = Math.atan2(dx, dz) - p.ry; while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
function poseLook(p, t, T){
  life(p, t, 0.4);
  /* key head directions (yaw relative to the body) with quick owl-like snaps */
  const L = yawTo(p, BUSH_L), R = yawTo(p, BUSH_R);
  const keys = [[0, 0], [0.95, 0], [1.1, L], [2.15, L], [2.3, 0.35 * L], [2.6, 0.35 * L], [2.75, R], [3.75, R], [4.1, 1.2], [4.6, 1.35], [4.75, -1.3], [5.3, -0.9], [5.5, -0.25], [8.9, -0.25], [9.3, -0.6], [9.9, 0]];
  let yaw = 0; for (let i = 0; i < keys.length - 1; i++){ const [a, ya] = keys[i], [b, yb] = keys[i + 1]; if (T >= a && T <= b){ yaw = lerp(ya, yb, ease(span(T, a, b))); break; } }

// ---------- 滑翔落地 ----------
const G_A = V3(0.5, 0, -0.75), G_L = V3(-0.95, 0, 0.85);
function poseGlide(p, t, T){
  life(p, t, 0.4);
  const yawStump = Math.atan2(STUMP.x - G_A.x, STUMP.z - G_A.z), yawRight = Math.atan2(G_L.x - STUMP.x, G_L.z - STUMP.z), yawBack = Math.atan2(G_A.x - G_L.x, G_A.z - G_L.z);
  /* 0-0.8 hop up onto the stump */
  if (T < 0.8){ const u = span(T, 0.15, 0.75); p.x = lerp(G_A.x, STUMP.x, ease(u)); p.z = lerp(G_A.z, STUMP.z, ease(u)); p.hop = lerp(0, STUMP_H, ease(u)) + 0.3 * Math.sin(Math.PI * u); p.ry = yawStump;
    squat(0.5 * bell(span(T, 0, 0.2)) + 0.5 * bell(span(T, 0.65, 0.95))); wings(0.35 * bell(u)); tuck(0.6 * bell(span(u, 0.1, 0.9))); }
  else if (T < 2.1){ p.x = STUMP.x; p.z = STUMP.z; p.hop = STUMP_H; p.ry = lerp(yawStump, yawRight, ease(span(T, 0.85, 1.4)));
    squat(0.5 * bell(span(T, 0.65, 0.95)) + 0.75 * ease(span(T, 1.6, 2.05))); spineLean(0.3 * ease(span(T, 1.6, 2.05)));
    const warm = bell(span(T, 1.0, 1.6)); wings(0.35 * warm, 0.3 * warm * Math.sin((T - 1.0) * 21)); }
  /* 2.1-5.0 leap and glide */
  else if (T < 5.0){ const u = span(T, 2.1, 5.0); p.x = lerp(STUMP.x, G_L.x, u); p.z = lerp(STUMP.z, G_L.z, u); p.ry = yawRight;
    const up = Math.sin(Math.PI * Math.min(1, u / 0.45)) * (u < 0.45 ? 1 : 0);
    p.hop = lerp(STUMP_H, 0, ease(span(u, 0.15, 1))) + 0.45 * Math.sin(Math.PI * Math.min(1, u * 1.6)) * (u < 0.625 ? 1 : 0);
    p.hop += 0.035 * bell(span(u, 0.72, 1.0));
    const spread = ease(span(u, 0, 0.12)) * (1 - ease(span(u, 0.9, 1)) * 0.5);
    const flap = u < 0.22 ? 0.35 * Math.sin(u * 60) * (1 - u / 0.22) : 0.04 * Math.sin(T * 3);
    wings(0.62 * spread, flap * spread);
    p.pitch = 0.32 * ease(span(u, 0.05, 0.3)) * (1 - ease(span(u, 0.82, 1)));
    p.roll = 0.18 * Math.sin(u * TAU * 1.0) * (1 - ease(span(u, 0.8, 1)));
    squat(0.75 * (1 - ease(span(u, 0, 0.08))) + 0.35 * ease(span(u, 0.85, 1))); spineLean(0.3 * (1 - ease(span(u, 0, 0.1))));
    for (const sd of sides){ const lg = 0.45 * ease(span(u, 0.08, 0.2)) * (1 - ease(span(u, 0.75, 0.92))); rot(sd + 'UpLeg', 'x', lg); rot(sd + 'Foot', 'x', -lg * 0.6); }
    rot('Tail01', 'x', -0.35 * spread); }
  /* 5.0-6.0 land and spin */
  else if (T < 6.0){ p.x = G_L.x; p.z = G_L.z; const u = span(T, 5.0, 6.0);
    p.ry = yawRight + (TAU - yawRight) * ease(span(T, 5.15, 5.95));
    squat(0.35 * (1 - ease(span(T, 5.0, 5.3)))); wings(0.31 * (1 - ease(span(T, 5.5, 6.0)))); p.hop = 0.04 * bell(span(T, 5.2, 5.5)); }
  /* 6.0-7.0 bow */
  else if (T < 7.0){ p.x = G_L.x; p.z = G_L.z; p.ry = TAU; const b = bell(span(T, 6.05, 6.95)); spineLean(0.55 * b); rot('neck', 'x', 0.15 * b); rot('LeftArm', 'x', -0.5 * b); rot('LeftArm', 'y', 0.45 * b); p.happy = b; }
  /* 7.0-10 waddle back to the start */
  else { const u = span(T, 7.2, 9.6); p.x = lerp(G_L.x, G_A.x, u); p.z = lerp(G_L.z, G_A.z, u);
    p.ry = lerp(TAU, yawBack + TAU, ease(span(T, 7.0, 7.3))); if (T > 9.5) p.ry = lerp(yawBack + TAU, yawStump + TAU, ease(span(T, 9.5, 9.95)));
    const w = Math.min(1, bell(span(T, 7.1, 9.7)) * 3); walkCycle(t * 7, w * 0.8, 0); { const k = w * 0.8, sn = Math.sin(t * 7); rot('LeftFoot', 'x', 0.42 * k * sn - 0.5 * k * Math.max(0, -sn)); rot('RightFoot', 'x', -0.42 * k * sn - 0.5 * k * Math.max(0, sn)); }   /* keep the big feet flat */ p.hop = (0.02 + 0.012 * Math.abs(Math.sin(t * 7))) * w; }

// ---------- 咕咕報時 ----------
const C_POS = V3(-0.15, 0, 0.3);
const COO = [[2.85, 3.6], [3.85, 4.6], [4.85, 5.65]];
function poseCuckoo(p, t, T){
  life(p, t, 0.4);
  p.x = C_POS.x; p.z = C_POS.z; p.ry = 0.3 * (1 - ease(span(T, 9.0, 9.5)));
  const startle = span(T, 5.85, 6.05), back = ease(startle) * (1 - ease(span(T, 6.9, 7.6)));
  p.x -= 0.16 * back; p.hop = 0.1 * bell(span(T, 5.85, 6.25));
  const clk = clockPt(0, 1.3, 0.1); const yawC = yawTo(p, clk);
  const watch = ease(span(T, 0.1, 0.5)) * (1 - ease(span(T, 2.6, 2.85))) + ease(span(T, 5.85, 5.97)) * (1 - ease(span(T, 6.5, 6.8))) + ease(span(T, 7.7, 7.95)) * (1 - ease(span(T, 8.9, 9.2)));
  /* tick tock: head bobs with the ticks while the minute hand sweeps to 12 */
  const tickA = T > 0.6 && T < 2.6 ? Math.pow(Math.abs(Math.sin((T - 0.6) * Math.PI * 2)), 6) : 0;
  let pitch = -0.12 * watch + 0.08 * tickA, roll = 0.12 * Math.sin((T - 0.6) * Math.PI) * (T > 0.6 && T < 2.6 ? 1 : 0) * watch;
  /* three coos: chest puff, wings open, head up then bob */
  let coo = 0; for (const [a, b] of COO) coo = Math.max(coo, bell(span(T, a, b)));
  const big = bell(span(T, COO[2][0], COO[2][1]));
  spineLean(-0.18 * coo); pitch += -0.15 * coo; wings(0.22 * coo + 0.15 * big);
  /* startled by the bird: wings flare, tufts up */
  const fl = bell(span(T, 5.85, 6.5)); wings(0.55 * fl); ears(-0.35 * fl);
  p.sad = ease(span(T, 5.88, 5.95)) * (1 - ease(span(T, 6.35, 6.5)));
  /* laugh */
  const joy = ease(span(T, 6.5, 6.8)) * (1 - ease(span(T, 9.4, 9.8))); p.happy = Math.max(p.happy, joy * (p.sad > 0.5 ? 0 : 1), coo > 0.5 ? 1 : 0);
  p.hop += 0.05 * joy * Math.abs(Math.sin((T - 6.5) * 9)) * (T < 7.8 ? 1 : 0);
  /* pat the bird back in with the left wing */
  const pat = bell(span(T, 7.9, 8.9)); rot('LeftArm', 'z', 0.7 * pat); rot('LeftArm', 'x', -0.5 * pat); rot('LeftArm', 'y', 0.35 * pat);
  /* bow to the camera */
  const bow = bell(span(T, 9.2, 9.95)); spineLean(0.45 * bow);
  owlTurn(yawC * 0.5 * watch, pitch, roll);
  tailSway(0.3 + 0.5 * joy, t, 2 + 4 * 0);
  if (hitT(T, 2.62)) p.events.push('ding');
  COO.forEach(([a], i) => { if (hitT(T, a + 0.35)) p.events.push('coo' + i); });
  if (hitT(T, 5.85)) p.events.push('pop'); if (hitT(T, 6.6)) p.events.push('laugh'); if (hitT(T, 8.75)) p.events.push('click');
  place(p);
}
/* clock parts follow time T (called from placeProps) */
function clockAt(T){
  const minA = (lerp(50, 60, ease(span(T, 0.6, 2.6)))) / 60 * TAU;   /* minute hand: :50 -> :00 */
  const hourA = 3 / 12 * TAU + minA / 12;
  const door = ease(span(T, 5.8, 5.88)) * (1 - ease(span(T, 8.7, 8.85)));
  const out = backOut(span(T, 5.82, 6.05)) * (1 - ease(span(T, 8.55, 8.8)));
  const bob = out > 0.5 ? 0.03 * Math.sin((T - 6) * 18) * (1 - span(T, 6.0, 7.5)) : 0;
  return {minA, hourA, door, out, bob};
}
const backOut = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function poseEat(p, t, name){

  const br = Math.sin(TAU * t / 3.6); rot('Spine02', 'x', 0.012 * br * 0.4); rot('Spine01', 'x', 0.012 * br * 0.4);
